<main style="display: flex; flex-direction: column">

  <section id="problem" class="dsd-sec">
    <div class="dsd-split dsd-wrap" style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: grid; gap: 24px 56px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #D6B5FF">Why It Matters</div>
        <h2 class="dsd-h2" style="margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.05; letter-spacing: -0.015em">Two Voices Are Not Yet Two Tracks</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: 24px">
        <p style="margin: 0; font-size: 20px; line-height: 1.5; color: #F7F7F7; text-wrap: pretty">Full-duplex dialogue models learn turn-taking from recordings with one track per person, yet most conversations exist only as a mix. Turning a mix into that data needs Track 1 to be the same person from the first minute to the last.</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="align-self: flex-start; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; white-space: nowrap; padding-bottom: 6px; border-bottom: 4px solid #FF0132">43.9%</span>
            <span style="font-size: 14px; line-height: 1.45; color: rgba(247,247,247,.78)">wrong-track time with no cross-chunk alignment</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="align-self: flex-start; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; white-space: nowrap; padding-bottom: 6px; border-bottom: 4px solid #FF0132">44.9%</span>
            <span style="font-size: 14px; line-height: 1.45; color: rgba(247,247,247,.78)">with the released overlap-cosine alignment</span>
          </div>
        </div>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: rgba(247,247,247,.82); text-wrap: pretty">Generative separation recovers the voices chunk by chunk, and every boundary re-decides which voice takes which slot. Over 26.7 hours of 25-minute calls, a quarter to a third of a floor-holder’s words leave their own track — and on these long calls the released alignment rule does not bring the error down.</p>
      </div>
    </div>
  </section>

  <section id="listen" class="dsd-band" style="background: radial-gradient(60% 50% at 50% 60%, rgba(150,65,255,.14), rgba(150,65,255,0)), #101011; border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); padding-top: 64px; padding-bottom: 64px">
    <div class="dsd-wrap" style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px">

        </sc-if>
        <sc-if value="{{listen2}}" hint-placeholder-val="{{false}}">

  <section id="method" class="dsd-sec">
    <div class="dsd-wrap" style="max-width: 1120px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 40px">
      <div class="dsd-split" style="display: grid; gap: 24px 48px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div style="font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #D6B5FF">Method</div>
          <h2 class="dsd-h2" style="margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.05; letter-spacing: -0.015em">Decide Who, Then Generate</h2>
          <p style="margin: 0; font-size: 20px; line-height: 1.5; color: rgba(247,247,247,.86); text-wrap: pretty">In two-stage generative separation, track identity is settled before diffusion: the generator copies the order of the coarse streams it receives. Anchoring acts at exactly that point.</p>
        </div>
        <div class="dsd-panel" style="min-width: 0; background: #1E1E1F; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 24px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
            <span style="font-size: 16px; font-weight: 600">Where identity is decided</span>
            <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(247,247,247,.72)"><span style="width: 2px; height: 12px; background: #F7F7F7"></span>chance, 50%</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                <span style="font-size: 16px; font-weight: 600">The generator follows the order it is given</span>
                <span style="font-size: 14px; line-height: 1.45; color: rgba(247,247,247,.72)">Track 1 carries Speaker A in 197 of 200 clips; reverse the order mid-clip and 96.8% of outputs follow.</span>
              </div>
              <span style="font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; white-space: nowrap">98.5%</span>
            </div>
            <div style="position: relative; height: 24px">
              <div style="position: absolute; inset: 0; border-radius: 6px; background: rgba(255,255,255,.08)"></div>
              <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 98.5%; border-radius: 6px; background: #9641FF"></div>
              <div style="position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: #F7F7F7"></div>

function dsdemoFmt(s) {

    return spans.length ? spans[spans.length - 1][2] : null;

    var o = ownerAt((i + 0.5) * bw);
    var spk = (o === null || o === undefined) ? 2 : (o ^ tr);

    if (owned && prev && s.c !== prev) out.push({ left: cum.toFixed(2), tip: 'Track 1 changes owner at ' + s.tip.split('–')[0] });
    if (owned) prev = s.c;
    cum += s.w;
  });
  return out;
}

function dsdemoTabs(labels, active, onPick) {
  return labels.map(function (label, i) {
    var on = i === active;
    return { label: label, pressed: on,
             bg: on ? '#F7F7F7' : 'transparent', color: on ? '#151515' : '#F7F7F7',
             border: on ? '#F7F7F7' : 'rgba(255,255,255,.3)',
             pick: function () { onPick(i); } };
  });
}

// Floor examples compare re-ID with routing only; cached so the Player sees a stable object.
var DSDEMO_FLOOR = {};
function dsdemoFloorEx(ex) {
  if (!DSDEMO_FLOOR[ex.id]) {
    DSDEMO_FLOOR[ex.id] = Object.assign({}, ex, { systems: ex.systems.filter(function (s) { return s.key !== 'released'; }) });
  }
  return DSDEMO_FLOOR[ex.id];
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lt: 0, ft: 0, hp: '' };
    var self = this;
    this.onOther = function (e) { if (e.detail !== 'hero') self.stopHero(); };
  }

  componentDidMount() { window.addEventListener('dsdemo:play', this.onOther); }

  componentWillUnmount() { window.removeEventListener('dsdemo:play', this.onOther); this.stopHero(); }

  // Hero clip: Track 1 of Example 1 around its swap, played as a media-fragment range.
  heroClip() {
    var ex = DSDEMO_DATA.flip1, a = Math.max(0, ex.jump - 3);
    return { ex: ex, from: a, to: Math.min(ex.dur, a + 10) };
  }

  stopHero() {
    var a = this.heroAudio;
    this.heroAudio = null;
    if (a) a.pause();
    if (this.state.hp) this.setState({ hp: '' });
  }

  heroToggle(key) {
    if (this.state.hp === key) { this.stopHero(); return; }
    this.stopHero();
    var c = this.heroClip(), s = c.ex.systems.filter(function (k) { return k.key === key; })[0];
    if (!s) return;
    window.dispatchEvent(new CustomEvent('dsdemo:play', { detail: 'hero' }));
    var self = this, a = new Audio(s.t1 + '#t=' + c.from + ',' + c.to);
    var done = function () { if (self.heroAudio === a) self.stopHero(); };
    a.addEventListener('pause', done);
    a.addEventListener('ended', done);
    a.addEventListener('timeupdate', function () { if (a.currentTime >= c.to) a.pause(); });
    this.heroAudio = a;
    this.setState({ hp: key });
    var p = a.play();
    if (p && p.catch) p.catch(done);
  }

  renderVals() {
    var self = this, d = DSDEMO_DATA, o = d.overview;
    var ticks = [0, 5, 10, 15, 20, 25].map(function (m) {
      return { left: (100 * m / o.minutes).toFixed(2), shift: m === 0 ? 0 : (m === 25 ? -100 : -50), label: m + ' min' };
    });
    var strata = [
      { name: 'Floor-holding', share: '12.2%', reid: 28.6, ours: 17.8, hl: true },
      { name: 'Strong asymmetry', share: '10.0%', reid: 10.2, ours: 7.2 },
      { name: 'Mild asymmetry', share: '30.0%', reid: 3.6, ours: 1.5 }
    ].map(function (r) {
      return Object.assign({}, r, {
        bg: r.hl ? 'rgba(150,65,255,.10)' : 'rgba(255,255,255,.02)',
        reidW: (100 * r.reid / 30).toFixed(1), oursW: (100 * r.ours / 30).toFixed(1),
        reidTip: r.name + ': waveform re-ID ' + r.reid + '% wrong-track time',
        oursTip: r.name + ': anchored routing ' + r.ours + '% wrong-track time'
      });
    });
    var AX = 45;
    var corpora = [
      { name: 'CANDOR · Remote Calls', meta: '64 held-out sessions · 26.7 h · routing alone; waveform re-ID with the same enrollment: 6.2%', before: 43.9, after: 4.1, unseen: false },
      { name: 'Seamless · Face-to-Face', meta: '360 improvised dyads · 25.3 h · routing 4.2%; verification on 20% of the output', before: 18.7, ring: 4.2, after: 1.7, unseen: true },
      { name: 'SpokenWOZ · 8 kHz Telephone', meta: '200 dialogues · 10.9 h · routing 2.3%; verification on 36% of the output', before: 13.4, ring: 2.3, after: 0.9, unseen: true }
    ].map(function (c) {
      var bp = 100 * c.before / AX, ap = 100 * c.after / AX;
      return Object.assign({}, c, {
        beforeP: bp.toFixed(2), afterP: ap.toFixed(2), spanP: (bp - ap).toFixed(2),
        beforeShift: bp > 90 ? -100 : -50,
        afterShift: ap < 8 ? 0 : -50, afterNudge: ap < 8 ? -9 : 0,
        hasRing: c.ring !== undefined, ringP: c.ring !== undefined ? (100 * c.ring / AX).toFixed(2) : '0',
        ringTip: c.ring !== undefined ? 'Routing alone: ' + c.ring.toFixed(1) + '%' : '',
        before: c.before.toFixed(1) + '%', after: c.after.toFixed(1) + '%'
      });
    });
    var axis = [0, 10, 20, 30, 40].map(function (v) {
      return { left: (100 * v / AX).toFixed(2), shift: v === 0 ? 0 : -50, label: v + '%' };
    });
    var lt = this.state.lt, ft = this.state.ft, hp = this.state.hp;
    var clip = this.heroClip(), w0 = dsdemoSec(clip.ex.where);
    var span = dsdemoClock(w0 + clip.from) + '–' + dsdemoClock(w0 + clip.to);
    var hero = {
      pb: 36,
      hint: 'Press play to hear Track 1 at ' + span + '. Without anchors it changes speaker at ' + dsdemoClock(w0 + clip.ex.jump) + '.',
      markText: dsdemoClock(w0 + clip.ex.jump) + ' · Example 1',
      relPlaying: hp === 'released', routePlaying: hp === 'route',
      relLabel: (hp === 'released' ? 'Pause' : 'Play') + ' Track 1, baseline, ' + span,
      routeLabel: (hp === 'route' ? 'Pause' : 'Play') + ' Track 1, anchored routing, ' + span,
      playRel: function () { self.heroToggle('released'); },
      playRoute: function () { self.heroToggle('route'); }
    };
    return {
      hero: hero,
      wm: 24, wmSmall: 22,
      ex: d,
      ov: { released: dsdemoMerge(o.released), route: dsdemoMerge(o.route), switches: dsdemoSwitches(o.released),
            wrongReleased: o.wrong_released, wrongRoute: o.wrong_route === 0 ? '0' : o.wrong_route,
            markLeft: o.mark.left, markW: o.mark.width, markRight: (100 - o.mark.left - o.mark.width).toFixed(2),
            ticks: ticks },
      listenTabs: dsdemoTabs(['Example 1', 'Example 2'], lt, function (i) { self.setState({ lt: i }); }),
      listen1: lt === 0, listen2: lt === 1,
      listenEx: lt === 0 ? d.flip1 : d.flip2,
      floorTabs: dsdemoTabs(['Example 3', 'Example 4'], ft, function (i) { self.setState({ ft: i }); }),
      floor1: ft === 0, floor2: ft === 1,
      floorEx: dsdemoFloorEx(ft === 0 ? d.floor21 : d.floor23),
      strata: strata,
      corpora: corpora,
      axis: axis,
      proof: [
        { eyebrow: 'Fixed-track activity F1', from: '0.46', value: '0.84', text: 'Each track follows one person’s turns across the whole call. In fixed order, speaker similarity rises from 0.27 to 0.43 (CANDOR).' },
        { eyebrow: 'With 120 s chunks', value: '1.9%', text: 'Four times fewer boundaries still leave 18.8% without alignment and 21.2% under the released rule; re-ID reaches 4.7%.' },
        { eyebrow: 'Of all errors', value: '89.2%', text: 'sit in the lowest-margin 22.3% of chunks (margin below 0.30, three corpora pooled): the margin shows verification where to look.' }
      ].map(function (p) { return Object.assign({ from: '', hasFrom: !!p.from }, p); })
    };
  }
}

return Component;
});
DC.mount('Main', document.getElementById('app'));
if (location.hash) { var dcT = document.getElementById(location.hash.slice(1)); if (dcT) dcT.scrollIntoView(); }
</script>
